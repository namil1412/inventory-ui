<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>탑뷰 이동 감각 테스트</title><style>
:root{color-scheme:dark;--bg:#080b0f;--panel:#151a21;--line:#34404d;--text:#edf2f7;--muted:#9aa6b2;--accent:#58d6b6}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;user-select:none}main{position:fixed;inset:0;display:grid;place-items:center}.camera{width:100%;height:100%;display:grid;place-items:center}canvas{display:block;width:min(100vw,calc(100vh * 16 / 9));height:auto;max-height:100vh;aspect-ratio:16/9;background:#111820}.toggle{position:fixed;z-index:9;right:14px;top:50%;transform:translateY(-50%);width:48px;min-height:78px;padding:8px 4px;border:1px solid #477e73;border-radius:7px;background:#17312c;color:#d9fff5;font-weight:800;cursor:pointer;transition:right .22s}.toggle span{display:block;font-size:18px}.open .toggle{right:334px}aside{position:fixed;z-index:8;right:0;top:0;width:320px;height:100vh;overflow:auto;padding:18px;background:rgba(21,26,33,.98);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .22s}.open aside{transform:none}h2{margin:0 0 14px;font-size:15px}.group{margin:16px 0 7px;color:#7ddbc3;font-size:11px;font-weight:900}.field{margin-bottom:11px}.field label{display:flex;justify-content:space-between;margin-bottom:5px;font-size:12px}.pair{display:grid;grid-template-columns:78px 1fr;gap:7px}.field input[type=number]{width:100%;height:33px;padding:0 8px;border:1px solid var(--line);border-radius:5px;background:#0d1217;color:var(--text)}input[type=range]{width:100%;accent-color:var(--accent)}.presets{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:7px 0 12px}button{border:1px solid var(--line);border-radius:5px;background:#0e1318;color:#cdd6de;cursor:pointer}.preset{padding:7px 1px}.preset.active,.preset:hover,button:hover{border-color:var(--accent);color:var(--accent)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}.actions button{min-height:36px}.check{display:flex;align-items:center;justify-content:space-between;padding:9px 0;font-size:12px}.debug,.summary{padding:10px;border:1px solid var(--line);border-radius:5px;background:#0d1217;font-size:12px}.row{display:flex;justify-content:space-between;gap:12px;padding:4px 0;color:var(--muted)}.row strong{color:var(--text);text-align:right}.state{color:var(--accent)!important}.note{margin-top:12px;color:#7f8b97;font-size:11px;line-height:1.5}@media(max-width:620px){aside{width:min(320px,calc(100vw - 58px))}.open .toggle{right:min(334px,calc(100vw - 44px))}}
</style></head><body><main><div class="camera"><canvas id="game" width="1920" height="1080" tabindex="0" aria-label="이동 테스트 화면"></canvas></div></main><button class="toggle" id="toggle"><span>⚙</span>설정</button><aside><h2>실시간 설정</h2><div class="group">비율 · 카메라</div>
<div class="field"><label>타일 원본 크기 <span>px</span></label><input id="tilePx" type="number" min="1" value="256"></div><div class="field"><label>캐릭터 가로 <span>타일</span></label><input id="charW" type="number" min=".1" step=".1" value="1"></div><div class="field"><label>캐릭터 세로 <span>타일</span></label><input id="charH" type="number" min=".1" step=".1" value="2"></div><div class="field"><label>FHD 가로 시야 <span>타일</span></label><input id="viewW" type="number" min="4" value="40"></div><div class="field"><label>테스트 맵 가로 <span>타일</span></label><input id="roomW" type="number" min="30" value="100"></div><div class="field"><label>테스트 맵 세로 <span>타일</span></label><input id="roomH" type="number" min="30" value="100"></div><div class="group">일반 이동</div>
<div class="field"><label>기본 이동속도 <span>타일/초</span></label><div class="pair"><input id="speed" type="number" min="1" max="10" step=".1" value="5"><input id="speedRange" type="range" min="1" max="10" step=".1" value="5"></div></div><div class="presets"><button class="preset" data-v="3">3</button><button class="preset" data-v="4">4</button><button class="preset active" data-v="5">5</button><button class="preset" data-v="6">6</button><button class="preset" data-v="7">7</button></div>
<div id="timeFields"></div><label class="check">이동 궤적 표시 <input id="trailOn" type="checkbox"></label><div class="actions"><button id="test">1초 이동 테스트</button><button id="reset">이동 데이터 초기화</button></div><div class="group">실시간 디버그</div><div class="debug" id="debug"></div><div class="group">현재 비율</div><div class="summary" id="summary"></div><div class="note">WASD 이동 · E 인벤토리 · 충돌 시 속도 0 · 벽 미끄러짐 없음</div></aside>
<script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),keys=new Set(),$=id=>document.querySelector('#'+id),fmt=n=>Number.isInteger(n)?String(n):n.toFixed(2).replace(/0+$/,'').replace(/\.$/,'');
const s={tilePx:256,charW:1,charH:2,viewW:40,roomW:100,roomH:100,max:5,accel:.15,decel:.1,turnDecel:.1,turnAccel:.15,x:50,y:50,dir:{x:0,y:0},target:null,v:0,mode:'정지',distance:0,trail:[],trailOn:false,test:null,testResult:null};const obs=[{x:62,y:40,w:3,h:22},{x:70,y:58,w:14,h:3},{x:25,y:25,w:12,h:4},{x:28,y:29,w:4,h:12},{x:75,y:25,w:8,h:8}];
const timeDefs=[['accel','가속 시간',.15],['decel','감속 시간',.1],['turnDecel','방향 전환 감속',.1],['turnAccel','방향 전환 재가속',.15]];$('timeFields').innerHTML=timeDefs.map(([id,n,v])=>`<div class="field"><label>${n}<span>초</span></label><div class="pair"><input id="${id}" type="number" min="0" max="1" step=".01" value="${v}"><input id="${id}Range" type="range" min="0" max="1" step=".01" value="${v}"></div></div>`).join('');
function bind(a,b,k,min,max){const A=$(a),B=$(b),set=v=>{v=Math.max(min,Math.min(max,Number(v)));if(!Number.isFinite(v))return;s[k]=v;A.value=v;B.value=v;update()};A.oninput=()=>set(A.value);B.oninput=()=>set(B.value)}bind('speed','speedRange','max',1,10);timeDefs.forEach(([id])=>bind(id,id+'Range',id,0,1));['tilePx','charW','charH','viewW','roomW','roomH'].forEach(id=>$(id).oninput=()=>{const v=Number($(id).value);if(v>0)s[id]=v});document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>{s.max=Number(b.dataset.v);$('speed').value=s.max;$('speedRange').value=s.max;document.querySelectorAll('.preset').forEach(x=>x.classList.toggle('active',x===b))});$('trailOn').onchange=e=>{s.trailOn=e.target.checked;if(!s.trailOn)s.trail=[]};$('reset').onclick=()=>{s.distance=0;s.trail=[];s.test=null;s.testResult=null;canvas.focus()};$('test').onclick=()=>{s.test={waiting:true,elapsed:0,distance:0,start:null,end:null};s.testResult=null;$('test').textContent='WASD 입력 대기';canvas.focus()};$('toggle').onclick=()=>{const o=document.body.classList.toggle('open');$('toggle').lastChild.textContent=o?'닫기':'설정'};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='e'&&!e.repeat){parent.postMessage({type:'toggle-inventory'},'*');e.preventDefault();return}if('wasd'.includes(k)&&document.activeElement===canvas){keys.add(k);e.preventDefault()}});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));canvas.onclick=()=>canvas.focus();
function inp(){let x=(keys.has('d')?1:0)-(keys.has('a')?1:0),y=(keys.has('s')?1:0)-(keys.has('w')?1:0),l=Math.hypot(x,y);return l?{x:x/l,y:y/l}:{x:0,y:0}}function approach(v,t,d){return v<t?Math.min(t,v+d):Math.max(t,v-d)}function dname(d){if(!d.x&&!d.y)return'없음';let v=d.y<-.38?'위':d.y>.38?'아래':'',h=d.x<-.38?'왼쪽':d.x>.38?'오른쪽':'';return h&&v?h+' '+v:h||v}function iname(){return['w','a','s','d'].filter(k=>keys.has(k)).map(k=>k.toUpperCase()).join('+')||'없음'}function hit(nx,ny){let l=nx-s.charW/2,r=nx+s.charW/2,t=ny-s.charH,b=ny;return obs.some(o=>l<o.x+o.w&&r>o.x&&t<o.y+o.h&&b>o.y)}
function step(dt){const i=inp();if(s.test?.waiting&&(i.x||i.y)){s.test.waiting=false;s.test.start={x:s.x,y:s.y};$('test').textContent='측정 중…'}if(s.mode==='방향 전환 감속 중'){if(i.x||i.y)s.target=i;s.v=approach(s.v,0,(s.turnDecel? s.max/s.turnDecel:Infinity)*dt);if(!s.v){s.dir=s.target||i;s.mode='방향 전환 재가속 중'}}else if(!i.x&&!i.y){s.target=null;if(s.v){s.mode='감속 중';s.v=approach(s.v,0,(s.decel?s.max/s.decel:Infinity)*dt)}if(!s.v){s.mode='정지';s.dir={x:0,y:0}}}else if(s.v>0&&s.dir.x*i.x+s.dir.y*i.y<-.00001){s.target=i;s.mode='방향 전환 감속 중'}else{s.dir=i;let tr=s.mode==='방향 전환 재가속 중',tm=tr?s.turnAccel:s.accel;s.v=approach(s.v,s.max,(tm?s.max/tm:Infinity)*dt);s.mode=s.v>=s.max-1e-6?'최대속도 이동 중':tr?'방향 전환 재가속 중':'가속 중'}let ox=s.x,oy=s.y,nx=s.x+s.dir.x*s.v*dt,ny=s.y+s.dir.y*s.v*dt;if(s.v&&(nx<s.charW/2||nx>s.roomW-s.charW/2||ny<s.charH||ny>s.roomH||hit(nx,ny))){s.v=0;s.mode='정지';s.dir={x:0,y:0};s.target=null}else{s.x=nx;s.y=ny}let m=Math.hypot(s.x-ox,s.y-oy);s.distance+=m;if(s.test&&!s.test.waiting&&!s.test.done){s.test.elapsed+=dt;s.test.distance+=m;if(s.test.elapsed>=1-1e-8){s.test.done=true;s.test.end={x:s.x,y:s.y};s.testResult=s.test.distance;$('test').textContent='1초 이동 테스트'}}if(s.trailOn&&m&&(!s.trail.length||Math.hypot(s.x-s.trail.at(-1).x,s.y-s.trail.at(-1).y)>.08)){s.trail.push({x:s.x,y:s.y});if(s.trail.length>700)s.trail.shift()}}
const row=(a,b,c='')=>`<div class="row"><span>${a}</span><strong class="${c}">${b}</strong></div>`;function update(){$('debug').innerHTML=row('설정 속도',s.max.toFixed(1)+' 타일/초')+row('현재 실제 속도',s.v.toFixed(2)+' 타일/초')+row('이동 방향',dname(s.dir))+row('WASD 입력',iname())+row('현재 상태',s.mode,'state')+row('가속 / 감속',s.accel.toFixed(2)+' / '+s.decel.toFixed(2)+'초')+row('전환 감속 / 재가속',s.turnDecel.toFixed(2)+' / '+s.turnAccel.toFixed(2)+'초')+row('누적 이동 거리',s.distance.toFixed(2)+'타일')+row('1초 실측',s.test?.waiting?'입력 대기':s.test&&!s.test.done?s.test.elapsed.toFixed(3)+'초':s.testResult==null?'—':s.testResult.toFixed(3)+'타일 (1.000초)');$('summary').innerHTML=row('타일',`${fmt(s.tilePx)} × ${fmt(s.tilePx)}px`)+row('캐릭터',`${fmt(s.charW)} × ${fmt(s.charH)}타일`)+row('카메라',`가로 ${fmt(s.viewW)} / 세로 ${fmt(s.viewW*9/16)}타일`)+row('맵',`${fmt(s.roomW)} × ${fmt(s.roomH)}타일`)}
function mark(p,c,l,cx,cy,px){if(!p)return;let x=(p.x-cx)*px,y=(p.y-cy)*px;ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fill();ctx.font='bold 17px sans-serif';ctx.fillText(l,x+11,y-10)}let last=performance.now();function draw(now){let raw=Math.min((now-last)/1000,.25);last=now;while(raw>1e-8){let dt=Math.min(.01,raw);if(s.test&&!s.test.waiting&&!s.test.done)dt=Math.min(dt,1-s.test.elapsed);if(dt<=0)break;step(dt);raw-=dt}const W=canvas.width,H=canvas.height,vh=s.viewW*H/W,px=W/s.viewW;let cx=Math.max(0,Math.min(s.x-s.viewW/2,s.roomW-s.viewW)),cy=Math.max(0,Math.min(s.y-vh/2,s.roomH-vh));ctx.fillStyle='#080b0f';ctx.fillRect(0,0,W,H);ctx.fillStyle='#1b2530';ctx.fillRect(-cx*px,-cy*px,s.roomW*px,s.roomH*px);ctx.beginPath();ctx.strokeStyle='#435264';ctx.lineWidth=1;for(let x=Math.floor(cx);x<=Math.ceil(cx+s.viewW);x++){ctx.moveTo((x-cx)*px,0);ctx.lineTo((x-cx)*px,H)}for(let y=Math.floor(cy);y<=Math.ceil(cy+vh);y++){ctx.moveTo(0,(y-cy)*px);ctx.lineTo(W,(y-cy)*px)}ctx.stroke();ctx.fillStyle='#59636e';ctx.strokeStyle='#9aa5b1';obs.forEach(o=>{ctx.fillRect((o.x-cx)*px,(o.y-cy)*px,o.w*px,o.h*px);ctx.strokeRect((o.x-cx)*px,(o.y-cy)*px,o.w*px,o.h*px)});if(s.trailOn&&s.trail.length>1){ctx.beginPath();ctx.strokeStyle='#59d8b8';ctx.lineWidth=4;ctx.moveTo((s.trail[0].x-cx)*px,(s.trail[0].y-cy)*px);s.trail.slice(1).forEach(p=>ctx.lineTo((p.x-cx)*px,(p.y-cy)*px));ctx.stroke()}mark(s.test?.start,'#ffd166','시작',cx,cy,px);mark(s.test?.end,'#ff7b72','도착',cx,cy,px);let x=(s.x-cx)*px,y=(s.y-cy)*px,w=s.charW*px,h=s.charH*px;ctx.fillStyle='#4ad2b0';ctx.fillRect(x-w/2,y-h,w,h);ctx.strokeStyle='#c4fff0';ctx.lineWidth=3;ctx.strokeRect(x-w/2,y-h,w,h);ctx.fillStyle='#ff6b6b';ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill();update();requestAnimationFrame(draw)}update();canvas.focus();requestAnimationFrame(draw);
</script></body></html>
